      content="A simple browser metronome: set the tempo and time signature, tap to set the tempo, and hear an accented first beat."

    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://lorenzowynberg.github.io/metronome/"
    />
    <meta
      property="og:image"
      content="https://lorenzowynberg.github.io/metronome/og-image.png"
    />
    <meta
      property="og:image:alt"
      content="An amber downbeat dot followed by three smaller beat dots on a dark background."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Metronome" />
    <meta
      name="twitter:description"
      content="A simple browser metronome: set the tempo and time signature, tap to set the tempo, and hear an accented first beat."

      name="twitter:image"
      content="https://lorenzowynberg.github.io/metronome/og-image.png"
    />
    <link rel="canonical" href="https://lorenzowynberg.github.io/metronome/" />
    <script type="application/ld+json">

    <main>
      <h1 class="visually-hidden">Metronome</h1>
      <section id="bpm-hero" aria-label="Tempo"></section>
      <div id="beat-indicator"></div>
      <div id="controls"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
